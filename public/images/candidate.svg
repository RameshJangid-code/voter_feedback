<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="turbanGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Circular Background -->
  <circle cx="200" cy="200" r="192" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="8" />

  <!-- Subtle glow ring -->
  <circle cx="200" cy="200" r="176" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" stroke-dasharray="6 6" />

  <!-- Shoulders & Kurta -->
  <path d="M 90 380 C 100 300, 150 280, 200 280 C 250 280, 300 300, 310 380 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
  
  <!-- Kurta Collar & Saffron Stole (Angavastram) -->
  <path d="M 165 280 L 175 380 L 190 380 L 180 280 Z" fill="#ea580c" opacity="0.9" />
  <path d="M 235 280 L 225 380 L 210 380 L 220 280 Z" fill="#15803d" opacity="0.9" />
  <path d="M 185 285 L 200 330 L 215 285 Z" fill="#f8fafc" />

  <!-- Neck -->
  <rect x="180" y="225" width="40" height="60" rx="8" fill="#fbd38d" />

  <!-- Face -->
  <ellipse cx="200" cy="205" rx="56" ry="68" fill="#fed7aa" />

  <!-- Ears -->
  <ellipse cx="142" cy="205" rx="10" ry="16" fill="#fed7aa" />
  <ellipse cx="258" cy="205" rx="10" ry="16" fill="#fed7aa" />

  <!-- Eyes & Eyebrows -->
  <path d="M 168 188 Q 180 183 192 188" stroke="#334155" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M 208 188 Q 220 183 232 188" stroke="#334155" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <ellipse cx="180" cy="198" rx="5" ry="4" fill="#1e293b" />
  <ellipse cx="220" cy="198" rx="5" ry="4" fill="#1e293b" />

  <!-- Nose -->
  <path d="M 200 195 L 196 220 L 204 220" stroke="#ca8a04" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Mustache (Traditional Dignified) -->
  <path d="M 170 236 C 185 230, 195 236, 200 238 C 205 236, 215 230, 230 236 C 238 240, 225 245, 200 242 C 175 245, 162 240, 170 236 Z" fill="#1e293b" />

  <!-- Warm Smile -->
  <path d="M 188 248 Q 200 256 212 248" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Saffron Rajasthani Safa / Turban (Candidate Attire) -->
  <path d="M 132 175 C 130 115, 270 115, 268 175 C 275 145, 265 110, 200 105 C 135 110, 125 145, 132 175 Z" fill="url(#turbanGrad)" />
  <path d="M 130 160 C 160 135, 240 135, 270 160 C 278 180, 265 178, 200 170 C 135 178, 122 180, 130 160 Z" fill="#ea580c" />
  <path d="M 138 145 C 170 125, 230 125, 262 145 Z" fill="#f59e0b" />
  
  <!-- Turban Fold Overlays -->
  <path d="M 140 168 Q 200 152 260 168" stroke="#c2410c" stroke-width="4" fill="none" />
  <path d="M 145 152 Q 200 138 255 152" stroke="#ea580c" stroke-width="3" fill="none" />
  <path d="M 155 136 Q 200 126 245 136" stroke="#fbbf24" stroke-width="3" fill="none" />

  <!-- Traditional Kalangi / Feather brooch -->
  <path d="M 197 105 L 203 105 L 200 80 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="200" cy="108" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5" />

  <!-- Tilak (Auspicious Red & Yellow Mark) -->
  <rect x="198" y="166" width="4" height="15" rx="2" fill="#dc2626" />
  <circle cx="200" cy="184" r="2.5" fill="#eab308" />

  <!-- Candidate Name Banner -->
  <g transform="translate(0, 320)">
    <rect x="60" y="20" width="280" height="40" rx="20" fill="#ffffff" stroke="#15803d" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))" />
    <text x="200" y="46" font-family="'Noto Sans Devanagari', sans-serif" font-size="19" font-weight="bold" fill="#14532d" text-anchor="middle">
      श्री मोहन सिंह जी
    </text>
  </g>
</svg>
